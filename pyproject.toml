[project]
name = "picai"
version = "0.1.0"
description = "Re-render images from raw pixels and strip C2PA, IPTC, XMP and EXIF metadata"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pillow>=11",
    "python-multipart>=0.0.20",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "uvicorn>=0.34",
]

[project.scripts]
picai = "picai.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/picai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
