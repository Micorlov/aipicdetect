name: Process inbox

on:
  push:
    branches: [main]
    paths: ["inbox/**"]
  workflow_dispatch:
    inputs:
      format:
        description: "Output format (blank = same as input)"
        type: choice
        options: ["", "jpeg", "png", "webp"]
        default: ""
      quality:
        description: "JPEG/WebP quality"
        default: "95"

permissions:
  contents: write

concurrency:
  group: process-inbox
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Cache detector model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('src/aipicdetect/detect.py') }}

      - name: Install
        run: uv sync --frozen

      - name: Scrub and score every image in inbox/
        env:
          FORMAT: ${{ github.event.inputs.format }}
          QUALITY: ${{ github.event.inputs.quality || '95' }}
        run: |
          set -euo pipefail
          args=(batch inbox clean --detect --quality "$QUALITY" --summary "$GITHUB_STEP_SUMMARY")
          if [ -n "$FORMAT" ]; then args+=(--format "$FORMAT"); fi
          uv run aipicdetect "${args[@]}"

      - name: Upload clean images as artifact
        uses: actions/upload-artifact@v4
        with:
          name: clean-images
          path: clean/
          if-no-files-found: ignore

      - name: Commit clean images and clear inbox
        run: |
          set -euo pipefail
          git config user.name "aipicdetect-bot"
          git config user.email "aipicdetect-bot@users.noreply.github.com"
          find inbox -type f ! -name .gitkeep -delete
          git add -A clean inbox
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: process inbox ($(date -u +%Y-%m-%dT%H:%MZ))"
          for attempt in 1 2 3; do
            git pull --rebase --autostash origin main && git push && exit 0
            echo "push attempt $attempt failed, retrying"
            sleep 5
          done
          exit 1
